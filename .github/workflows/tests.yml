name: tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so a newly-published advisory against a dependency surfaces
    # without waiting for the next push.
    - cron: '0 3 * * 1'

permissions:
  contents: read

jobs:
  tests:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.5']

    steps:
      - uses: actions/checkout@v4
        with:
          # The changelog is rendered from the whole history and grouped by tag, so the check
          # below needs both. The default checkout is `fetch-depth: 1` with no tags, which
          # leaves it rendering a one-entry changelog and reporting every real one as stale.
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: pcov
          tools: composer:v2

      - name: Install dependencies
        uses: ramsey/composer-install@v3

      - name: Validate composer.json
        run: composer validate --strict

      - name: Run tests
        run: vendor/bin/phpunit --coverage-text --coverage-clover=coverage.xml

      # The examples are documentation, and the whole suite stayed green through a rewrite that
      # broke every one of them — nothing executed them. This does.
      - name: Run examples
        run: php tools/check-examples.php

      # These two have existed as composer scripts and as tools/ since before this workflow, and
      # neither has ever run here — the `ci` script listed them and the workflow did not.
      - name: Check {@see} references
        run: php tools/check-references.php

      - name: Check CHANGELOG is current
        run: php tools/changelog.php --check

      - name: Upload coverage
        if: matrix.php == '8.5'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  static-analysis:
    name: PHPStan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        uses: ramsey/composer-install@v3

      - name: Run PHPStan (src)
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

      - name: Run PHPStan (tests)
        run: vendor/bin/phpstan analyse -c phpstan-tests.neon --no-progress --memory-limit=1G

  style:
    name: Code style
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        uses: ramsey/composer-install@v3

      # The pre-commit hook does this locally, but --no-verify skips it and a clone that never
      # ran composer install never had it. This is the one that actually holds the line.
      - name: Check formatting
        run: composer test:style

      # Rules that could change behaviour are never applied automatically. They report here, and
      # a finding fails the build rather than being silently rewritten.
      - name: Report risky findings
        run: composer style:report

  audit:
    name: Security advisories
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        uses: ramsey/composer-install@v3

      - name: Audit
        run: composer audit
